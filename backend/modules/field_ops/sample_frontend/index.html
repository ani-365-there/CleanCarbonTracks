<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Field Ops Kernel demo</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:28px; }
    h1 { font-size:22px; margin:0 0 6px; }
    .sub { color:#94a3b8; margin-bottom:18px; font-size:14px; }
    .row { display:flex; gap:22px; flex-wrap:wrap; }
    .card { background:#1e293b; border-radius:10px; padding:16px 18px; min-width:300px; flex:1; }
    button { background:#3b82f6; color:#fff; border:0; border-radius:6px; padding:10px 14px; cursor:pointer; margin:0 8px 8px 0; }
    button.warn { background:#ef4444; }
    button.ok { background:#22c55e; color:#052e16; }
    .kv { font-size:14px; line-height:1.7; }
    .ok { color:#4ade80; } .bad { color:#f87171; }
    .log { font-family: Consolas, monospace; font-size:12px; color:#93c5fd; }
  </style>
</head>
<body>
  <h1>Field Ops Kernel</h1>
  <p class="sub">Score + inbox + GPS proof. One job, no waste app around it.</p>
  <div class="row">
    <div class="card">
      <button onclick="act('/open')">1. Open job</button>
      <button onclick="act('/assign')">2. Assign Arun</button>
      <button onclick="act('/start')">3. Start</button>
      <button class="ok" onclick="act('/proof', {far:false})">4a. After-photo at pin</button>
      <button class="warn" onclick="act('/proof', {far:true})">4b. After-photo 2 km away</button>
      <button onclick="act('/complete')">5. Complete</button>
    </div>
    <div class="card">
      <div class="kv" id="job">Click Open job.</div>
    </div>
    <div class="card">
      <div class="log" id="log"></div>
    </div>
  </div>
<script>
async function act(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : "{}"
  });
  const data = await res.json();
  render(data);
}
function render(data) {
  const j = data.job, s = data.scored, v = data.verify;
  if (!j) { document.getElementById("job").textContent = data.message || data.error || "No job"; return; }
  let html = `<b>${j.title}</b><br>status: ${j.status}<br>assignee: ${j.assigneeId || "—"}<br>`;
  if (s) html += `score: ${s.score} · rank: ${s.rankHint} · SLA: ${s.slaDueAt}<br>`;
  if (v) html += v.ok
    ? `<span class="ok">proof OK</span> (fingerprint + location)`
    : `<span class="bad">proof FAIL</span> location=${v.checks.location} fingerprint=${v.checks.fingerprint}`;
  document.getElementById("job").innerHTML = html;
  document.getElementById("log").innerHTML = (data.events || []).map(e => e.name + " → " + e.status).join("<br>");
}
fetch("/state").then(r => r.json()).then(render);
</script>
</body>
</html>
