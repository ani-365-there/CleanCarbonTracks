<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Field-Job Router demo</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:28px; }
    h1 { font-size:22px; margin:0 0 6px; }
    .sub { color:#94a3b8; margin-bottom:18px; font-size:14px; }
    .row { display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start; }
    .card { background:#1e293b; border-radius:10px; padding:16px 18px; min-width:280px; }
    button, label { font-size:14px; }
    button { background:#3b82f6; color:#fff; border:0; border-radius:6px; padding:10px 16px; cursor:pointer; margin-right:8px; }
    button.alt { background:#334155; }
    input[type=range] { width:180px; }
    ol { margin:8px 0 0 18px; padding:0; }
    li { margin:8px 0; }
    .badge { display:inline-block; background:#0ea5e9; color:#042f4a; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:700; margin-left:6px; }
    .skip { color:#f87171; }
    .meta { color:#94a3b8; font-size:13px; margin-top:10px; }
    svg { background:#0b1220; border-radius:10px; }
    .dot { font-weight:700; }
  </style>
</head>
<body>
  <h1>Priority Field-Job Router</h1>
  <p class="sub">Pins + priority in → clustered visit order out. Not maps — stop sequence.</p>
  <div class="row">
    <div class="card">
      <p>Priority vs distance <span id="wLabel">0.50</span></p>
      <input id="weight" type="range" min="0" max="100" value="50" />
      <p>Capacity <input id="capacity" type="number" value="" placeholder="none" style="width:70px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px; padding:4px;" /> (try 3)</p>
      <button onclick="plan()">Plan route</button>
      <button class="alt" onclick="plan(3)">Plan with capacity 3</button>
      <div class="meta" id="summary"></div>
      <ol id="stops"></ol>
      <p class="skip" id="skipped"></p>
    </div>
    <svg id="map" width="420" height="320"></svg>
  </div>
<script>
const API = "";
function xy(lat, lng) {
  const minLat = 20.353, maxLat = 20.3575, minLng = 85.818, maxLng = 85.822;
  return [20 + (lng - minLng) / (maxLng - minLng) * 380, 300 - (lat - minLat) / (maxLat - minLat) * 280];
}
async function plan(cap) {
  const w = document.getElementById("weight").value / 100;
  document.getElementById("wLabel").textContent = w.toFixed(2);
  const capacity = cap ?? (document.getElementById("capacity").value || null);
  const res = await fetch(API + "/plan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ priority_weight: w, capacity: capacity ? Number(capacity) : null })
  });
  const plan = await res.json();
  document.getElementById("summary").textContent =
    plan.clusters + " clusters · " + plan.totalDistanceMeters + " m total";
  document.getElementById("stops").innerHTML = plan.stops.map((s, i) =>
    `<li><span class="dot">${i + 1}.</span> ${s.title || s.id} · p=${s.priority} · ${s.distanceFromPreviousMeters} m<span class="badge">${s.clusterId}</span></li>`
  ).join("");
  document.getElementById("skipped").textContent = plan.skipped.length
    ? "Skipped: " + plan.skipped.map(x => (x.job.title || x.job.id) + " (" + x.reason + ")").join(", ")
    : "";
  const svg = document.getElementById("map");
  const jobs = await (await fetch(API + "/jobs")).json();
  const start = xy(jobs.start.lat, jobs.start.lng);
  let lines = "";
  let prev = start;
  plan.stops.forEach((s, i) => {
    const p = xy(s.location.lat, s.location.lng);
    lines += `<line x1="${prev[0]}" y1="${prev[1]}" x2="${p[0]}" y2="${p[1]}" stroke="#38bdf8" stroke-width="2"/>`;
    lines += `<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="#22c55e"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" fill="#052e16" font-size="11" font-weight="700">${i+1}</text>`;
    prev = p;
  });
  svg.innerHTML = `<circle cx="${start[0]}" cy="${start[1]}" r="8" fill="#f59e0b"/><text x="${start[0]+12}" y="${start[1]+4}" fill="#fbbf24" font-size="12">start</text>` + lines;
}
document.getElementById("weight").oninput = () => document.getElementById("wLabel").textContent = (document.getElementById("weight").value/100).toFixed(2);
plan();
</script>
</body>
</html>
