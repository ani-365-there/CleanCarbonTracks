<!DOCTYPE html>
<html>
<head>
    <title>Notification System</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: none;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background: #3b82f6;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        #list {
            margin-top: 30px;
        }

        .notification {
            background: #1e293b;
            padding: 12px;
            margin: 10px auto;
            width: 300px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Popup */
        .popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #22c55e;
            color: white;
            padding: 15px;
            border-radius: 6px;
            animation: slideIn 0.5s;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>

<body>

<h2>🔔 Notification System</h2>

<input id="user" placeholder="Enter user">
<input id="message" placeholder="Enter message">
<br>
<button onclick="sendNotif()">Send Notification</button>

<div id="list"></div>

<!-- ✅ LINK EXTERNAL JS -->
<script src="script.js"></script>

</body>
</html>
